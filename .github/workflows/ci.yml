name: CI Backend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  install-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar sintaxis del entrypoint
        run: node --check src/server.js
